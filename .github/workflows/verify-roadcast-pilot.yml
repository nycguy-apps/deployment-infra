name: Verify RoadCast Cloudflare pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-roadcast-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Worker health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 https://roadcast-api.mikewiley-nyc.workers.dev/health

      - name: Verify browser navigation serves RoadCast
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Sec-Fetch-Mode: navigate' \
            -H 'Sec-Fetch-Site: none' \
            https://roadcast-api.mikewiley-nyc.workers.dev/ | grep -q RoadCast

      - name: Record plain HTTP root status
        shell: bash
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://roadcast-api.mikewiley-nyc.workers.dev/)
          echo "Plain root status: $status"
