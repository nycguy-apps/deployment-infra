name: Verify RoadCast Cloudflare pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-roadcast-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Worker health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 https://roadcast-api.mikewiley-nyc.workers.dev/health

      - name: Verify browser navigation serves RoadCast
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Sec-Fetch-Mode: navigate' \
            -H 'Sec-Fetch-Site: none' \
            https://roadcast-api.mikewiley-nyc.workers.dev/ | grep -q RoadCast

      - name: Verify same-origin provider proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Sec-Fetch-Site: same-origin' \
            --get \
            --data-urlencode 'url=https://api.open-meteo.com/v1/forecast?latitude=40.7&longitude=-74&hourly=temperature_2m&forecast_days=1' \
            https://roadcast-api.mikewiley-nyc.workers.dev/v1/fetch | grep -q '"hourly"'

      - name: Verify arbitrary cross-origin proxy use stays blocked
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Origin: https://example.com' \
            --get \
            --data-urlencode 'url=https://api.open-meteo.com/v1/forecast?latitude=40.7&longitude=-74&hourly=temperature_2m&forecast_days=1' \
            https://roadcast-api.mikewiley-nyc.workers.dev/v1/fetch)
          test "$status" = "403"

      - name: Record plain HTTP root status
        shell: bash
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://roadcast-api.mikewiley-nyc.workers.dev/)
          echo "Plain root status: $status"
