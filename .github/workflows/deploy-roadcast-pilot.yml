name: Deploy RoadCast pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-roadcast-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-roadcast:
    uses: nycguy-apps/deployment-infra/.github/workflows/deploy-cloudflare.yml@main
    with:
      checkout_repository: "nycguy/roadcast"
      checkout_ref: "63a15e1f1821f3c1c4ca8e888c4c402b264acc0a"
      lint_command: ""
      typecheck_command: "npm run check"
      test_command: "npm test"
      build_command: "VITE_BASE_PATH=/ VITE_ROADCAST_PROXY_URL=https://roadcast-api.mikewiley-nyc.workers.dev npm run build"
      smoke_command: "npm run smoke:live"
      deploy_command: "npx --yes wrangler@4 deploy"
      post_deploy_command: "curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: none' https://roadcast-api.mikewiley-nyc.workers.dev/ | grep -q RoadCast"
      healthcheck_url: "https://roadcast-api.mikewiley-nyc.workers.dev/health"
    secrets: inherit
